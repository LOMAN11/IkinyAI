<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loman</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <header class="chat-header">
            <h1>🤖 Loman</h1>
            <p>AI yawe mu Kinyarwanda</p>
        </header>

        <main id="chat-box" class="chat-box">

            <div class="message loman-message">
                <strong>Loman:</strong>
                <p>Muraho! Ndi Loman. Nakumva kandi nkagusubiza mu Kinyarwanda. 👋</p>
            </div>

        </main>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Andika ikibazo cyawe..."
            >

            <button onclick="sendMessage()">
                Ohereza
            </button>

            <button class="voice-button">
                🎤
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
